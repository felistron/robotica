<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detector de Figuras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      padding: 16px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      text-align: center;
    }
    header h1 { font-size: 18px; font-weight: 500; color: #4ade80; }
    header p  { font-size: 12px; color: #888; margin-top: 2px; }

    #video-wrapper {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4/3;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #stream {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #555;
    }
    #placeholder svg { opacity: 0.4; }
    #placeholder p { font-size: 13px; }

    .controles {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      width: 100%;
      max-width: 640px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    #btn-iniciar { background: #4ade80; color: #0a1a0a; }
    #btn-detener { background: #2a2a2a; color: #aaa; }
    #btn-detener:disabled { opacity: 0.3; }

    .leyenda {
      width: 100%;
      max-width: 640px;
      padding: 0 20px 24px;
    }
    .leyenda h2 { font-size: 13px; color: #666; margin-bottom: 10px; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      color: #bbb;
    }
  </style>
</head>
<body>
  <video id="camara" autoplay playsinline style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>
<img id="resultado" style="width:100%;max-width:640px;display:block;margin:auto">

<div style="text-align:center;padding:16px;gap:12px;display:flex;justify-content:center">
  <button onclick="iniciar()" id="btn-iniciar"
    style="padding:12px 24px;background:#4ade80;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer">
    ▶ Iniciar
  </button>
  <button onclick="detener()" id="btn-detener" disabled
    style="padding:12px 24px;background:#2a2a2a;color:#aaa;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer">
    ■ Detener
  </button>
</div>

<script>
  const video = document.getElementById('camara');
  const canvas = document.getElementById('canvas');
  const resultado = document.getElementById('resultado');
  let corriendo = false;

  async function iniciar() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }  // cámara trasera
    });
    video.srcObject = stream;
    corriendo = true;
    document.getElementById('btn-iniciar').disabled = true;
    document.getElementById('btn-detener').disabled = false;
    procesarLoop();
  }

  function detener() {
    corriendo = false;
    video.srcObject?.getTracks().forEach(t => t.stop());
    document.getElementById('btn-iniciar').disabled = false;
    document.getElementById('btn-detener').disabled = true;
  }

  async function procesarLoop() {
    if (!corriendo) return;

    // Capturar frame del video
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imagen = canvas.toDataURL('image/jpeg', 0.7);

    try {
      const res = await fetch('/procesar_frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imagen })
      });
      const data = await res.json();
      resultado.src = data.imagen;
    } catch (e) {
      console.error(e);
    }

    // ~15 FPS
    setTimeout(procesarLoop, 1);
  }
</script>
</body>
</html>
